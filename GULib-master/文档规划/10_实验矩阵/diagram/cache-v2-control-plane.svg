<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cache V2 control plane</title>
  <desc id="desc">Experiment configuration requests artifacts through a resolver. The immutable artifact store and cache index are independent from experiment configuration.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill:#f8fafc; font-size:24px; font-weight:700; letter-spacing:-0.5px; }
      .subtitle { fill:#94a3b8; font-size:11px; }
      .region-title { font-size:10px; font-weight:700; letter-spacing:1.4px; }
      .name { fill:#f8fafc; font-size:13px; font-weight:700; }
      .desc { fill:#94a3b8; font-size:9.5px; }
      .small { fill:#cbd5e1; font-size:9px; }
      .tiny { fill:#94a3b8; font-size:8px; }
      .arrow-label { fill:#cbd5e1; font-size:8.5px; font-weight:600; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="resolverGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#065f46" stop-opacity="0.28"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="#0f172a"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <text x="42" y="45" class="title">CACHE V2 · CONTROL PLANE</text>
  <text x="42" y="66" class="subtitle">实验负责提出请求与保存引用；Cache 负责独立保存不可变 Artifact</text>

  <rect x="40" y="104" width="330" height="344" rx="16" fill="#071522" fill-opacity="0.72" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="60" y="128" class="region-title" fill="#22d3ee">REQUEST PLANE · 可变</text>

  <rect x="750" y="104" width="410" height="344" rx="16" fill="#17102c" fill-opacity="0.56" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="770" y="128" class="region-title" fill="#a78bfa">CACHE PLANE · 独立 / 不可变</text>

  <!-- Connections behind cards -->
  <path d="M205 223V277" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M320 327H450" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M450 294H320" fill="none" stroke="#34d399" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow-emerald)"/>
  <path d="M670 264H790" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M790 291H670" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <path d="M670 345H810" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M810 371H670" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <path d="M930 307V325" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M205 377V466H930V413" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>

  <!-- Cards: opaque masks then visual layers -->
  <g filter="url(#shadow)">
    <rect x="95" y="155" width="220" height="68" rx="10" fill="#0f172a"/>
    <rect x="95" y="155" width="220" height="68" rx="10" fill="#083344" fill-opacity="0.55" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="124" cy="189" r="15" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee"/>
    <path d="M117 184h14M117 189h14M117 194h9" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round"/>
    <text x="225" y="184" class="name" text-anchor="middle">YAML / CLI</text>
    <text x="225" y="202" class="desc" text-anchor="middle">批量请求入口，不参与 Cache identity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="277" width="230" height="100" rx="10" fill="#0f172a"/>
    <rect x="90" y="277" width="230" height="100" rx="10" fill="#083344" fill-opacity="0.42" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="205" y="309" class="name" text-anchor="middle">Experiment Record</text>
    <text x="205" y="330" class="desc" text-anchor="middle">完整实验设置只保存一次</text>
    <line x1="115" y1="344" x2="295" y2="344" stroke="#164e63"/>
    <text x="205" y="361" class="small" text-anchor="middle">effective config + Artifact IDs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="220" width="220" height="170" rx="16" fill="#0f172a"/>
    <rect x="450" y="220" width="220" height="170" rx="16" fill="url(#resolverGlow)" stroke="#34d399" stroke-width="2"/>
    <circle cx="560" cy="260" r="19" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
    <path d="M550 260h20M560 250v20" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <text x="560" y="302" class="name" text-anchor="middle">Artifact Resolver</text>
    <text x="560" y="323" class="desc" text-anchor="middle">Recipe normalize · exact / compatible lookup</text>
    <line x1="478" y1="339" x2="642" y2="339" stroke="#065f46"/>
    <text x="560" y="358" class="small" text-anchor="middle">只返回 ID，不接管实验 config</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="205" width="280" height="102" rx="12" fill="#0f172a"/>
    <rect x="790" y="205" width="280" height="102" rx="12" fill="#4c1d95" fill-opacity="0.35" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="930" y="240" class="name" text-anchor="middle">ArtifactStore</text>
    <text x="930" y="262" class="desc" text-anchor="middle">Score · Selection · Prediction · Evaluation</text>
    <line x1="825" y1="276" x2="1035" y2="276" stroke="#5b21b6"/>
    <text x="930" y="293" class="small" text-anchor="middle">immutable payload · independent lifecycle</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="325" width="240" height="88" rx="8" fill="#0f172a"/>
    <path d="M810 340c0-8 54-15 120-15s120 7 120 15v58c0 8-54 15-120 15s-120-7-120-15z" fill="#4c1d95" fill-opacity="0.28" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="930" cy="340" rx="120" ry="15" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="930" y="365" class="name" text-anchor="middle">CacheIndex</text>
    <text x="930" y="385" class="desc" text-anchor="middle">Recipe · dependency · consumer refs</text>
  </g>

  <!-- Arrow labels with opaque masks -->
  <rect x="354" y="313" width="92" height="19" rx="5" fill="#0f172a"/>
  <text x="400" y="326" class="arrow-label" text-anchor="middle">Artifact request</text>
  <rect x="349" y="278" width="97" height="19" rx="5" fill="#0f172a"/>
  <text x="397" y="291" class="arrow-label" text-anchor="middle">Artifact IDs</text>
  <rect x="704" y="251" width="72" height="18" rx="5" fill="#0f172a"/>
  <text x="740" y="264" class="arrow-label" text-anchor="middle">payload</text>
  <rect x="686" y="332" width="105" height="18" rx="5" fill="#0f172a"/>
  <text x="738" y="345" class="arrow-label" text-anchor="middle">metadata lookup</text>
  <rect x="500" y="453" width="126" height="19" rx="5" fill="#0f172a"/>
  <text x="563" y="466" class="arrow-label" text-anchor="middle">consumer refs only</text>

  <rect x="40" y="510" width="1120" height="76" rx="12" fill="#111c2e" stroke="#334155"/>
  <circle cx="72" cy="548" r="14" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24"/>
  <text x="72" y="552" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">!</text>
  <text x="100" y="539" fill="#f8fafc" font-size="11" font-weight="700">INVARIANT</text>
  <text x="100" y="558" class="small">config_name、YAML 路径、batch 名和 experiment 名永远不进入 Artifact Recipe、Artifact ID 或物理路径。</text>
  <text x="100" y="575" class="tiny">修改实验只会重新 resolve / 改绑引用；不会改写或 invalidate 既有 Cache。</text>
</svg>
