<svg viewBox="0 0 1340 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cache V2 artifact DAG</title>
  <desc id="desc">Four independent cache artifact types form a dependency graph from score to selection to prediction to evaluation. Result views are not caches.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill:#f8fafc; font-size:24px; font-weight:700; letter-spacing:-0.5px; }
      .subtitle { fill:#94a3b8; font-size:11px; }
      .lane { font-size:9px; font-weight:700; letter-spacing:1.3px; }
      .name { fill:#f8fafc; font-size:13px; font-weight:700; }
      .desc { fill:#94a3b8; font-size:9px; }
      .field { fill:#cbd5e1; font-size:8.5px; }
      .label { fill:#cbd5e1; font-size:8px; font-weight:600; }
      .note { fill:#cbd5e1; font-size:9.5px; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1340" height="670" fill="#0f172a"/>
  <rect width="1340" height="670" fill="url(#grid)"/>
  <text x="42" y="45" class="title">CACHE V2 · ARTIFACT DAG</text>
  <text x="42" y="66" class="subtitle">四类一级 Cache；模型执行是瞬时生产过程，Result 只是可再生视图</text>

  <rect x="38" y="92" width="252" height="400" rx="16" fill="#111827" fill-opacity="0.68" stroke="#64748b" stroke-dasharray="8 6"/>
  <text x="58" y="117" class="lane" fill="#94a3b8">INPUT IDENTITIES · NOT CACHE</text>

  <rect x="316" y="92" width="988" height="400" rx="16" fill="#071522" fill-opacity="0.55" stroke="#334155"/>
  <text x="336" y="117" class="lane" fill="#67e8f9">INDEPENDENT IMMUTABLE ARTIFACTS</text>

  <!-- Graph identity bus and input edges -->
  <path d="M250 171H1180" fill="none" stroke="#60a5fa" stroke-width="1.7"/>
  <path d="M430 171V240" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M675 171V240" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M920 171V240" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M1165 171V240" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M250 292H330" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M250 418H790V350H820" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>

  <!-- Main DAG edges -->
  <path d="M530 295H575" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <path d="M775 295H820" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-violet)"/>
  <path d="M1020 295H1065" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <path d="M1165 350V397" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

  <!-- Input cards -->
  <g filter="url(#shadow)">
    <rect x="72" y="137" width="178" height="68" rx="9" fill="#0f172a"/>
    <rect x="72" y="137" width="178" height="68" rx="9" fill="#1e3a8a" fill-opacity="0.34" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="161" y="164" class="name" text-anchor="middle">Graph / Split</text>
    <text x="161" y="185" class="desc" text-anchor="middle">fingerprint · node ID space</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="254" width="178" height="76" rx="9" fill="#0f172a"/>
    <rect x="72" y="254" width="178" height="76" rx="9" fill="#083344" fill-opacity="0.46" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="161" y="282" class="name" text-anchor="middle">Selector Model</text>
    <text x="161" y="302" class="desc" text-anchor="middle">identity only</text>
    <text x="161" y="317" class="desc" text-anchor="middle">checkpoint not required</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="380" width="178" height="76" rx="9" fill="#0f172a"/>
    <rect x="72" y="380" width="178" height="76" rx="9" fill="#4c1d95" fill-opacity="0.32" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="161" y="408" class="name" text-anchor="middle">Target Recipe</text>
    <text x="161" y="429" class="desc" text-anchor="middle">model · GU method · seed</text>
  </g>

  <!-- Artifact cards -->
  <g filter="url(#shadow)">
    <rect x="330" y="240" width="200" height="110" rx="12" fill="#0f172a"/>
    <rect x="330" y="240" width="200" height="110" rx="12" fill="#083344" fill-opacity="0.48" stroke="#22d3ee" stroke-width="1.7"/>
    <text x="430" y="273" class="name" text-anchor="middle">01 · ScoreArtifact</text>
    <line x1="354" y1="287" x2="506" y2="287" stroke="#155e75"/>
    <text x="430" y="306" class="field" text-anchor="middle">score vector / ranking</text>
    <text x="430" y="323" class="field" text-anchor="middle">TracIn · IM · CELF</text>
    <text x="430" y="340" class="desc" text-anchor="middle">shared across k / methods</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="575" y="240" width="200" height="110" rx="12" fill="#0f172a"/>
    <rect x="575" y="240" width="200" height="110" rx="12" fill="#064e3b" fill-opacity="0.44" stroke="#34d399" stroke-width="1.7"/>
    <text x="675" y="273" class="name" text-anchor="middle">02 · SelectionArtifact</text>
    <line x1="599" y1="287" x2="751" y2="287" stroke="#047857"/>
    <text x="675" y="306" class="field" text-anchor="middle">ordered selected nodes</text>
    <text x="675" y="323" class="field" text-anchor="middle">ordered hash · set hash</text>
    <text x="675" y="340" class="desc" text-anchor="middle">shared across GU targets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="240" width="200" height="110" rx="12" fill="#0f172a"/>
    <rect x="820" y="240" width="200" height="110" rx="12" fill="#4c1d95" fill-opacity="0.38" stroke="#a78bfa" stroke-width="1.7"/>
    <text x="920" y="273" class="name" text-anchor="middle">03 · PredictionArtifact</text>
    <line x1="844" y1="287" x2="996" y2="287" stroke="#6d28d9"/>
    <text x="920" y="306" class="field" text-anchor="middle">logits_before</text>
    <text x="920" y="323" class="field" text-anchor="middle">logits_unlearned · retrained</text>
    <text x="920" y="340" class="desc" text-anchor="middle">checkpoint-free observation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1065" y="240" width="200" height="110" rx="12" fill="#0f172a"/>
    <rect x="1065" y="240" width="200" height="110" rx="12" fill="#78350f" fill-opacity="0.34" stroke="#fbbf24" stroke-width="1.7"/>
    <text x="1165" y="273" class="name" text-anchor="middle">04 · EvaluationArtifact</text>
    <line x1="1089" y1="287" x2="1241" y2="287" stroke="#92400e"/>
    <text x="1165" y="306" class="field" text-anchor="middle">F1 · Gap · collateral</text>
    <text x="1165" y="323" class="field" text-anchor="middle">versioned AUC / metrics</text>
    <text x="1165" y="340" class="desc" text-anchor="middle">offline recomputable</text>
  </g>

  <!-- Transient execution pill -->
  <rect x="777" y="201" width="286" height="25" rx="12.5" fill="#431407" stroke="#fb923c" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="920" y="218" fill="#fdba74" font-size="8.5" font-weight="700" text-anchor="middle">TRANSIENT PRODUCER · before + GU + exact retrain</text>

  <!-- Result view: explicitly outside cache -->
  <g filter="url(#shadow)">
    <rect x="1065" y="397" width="200" height="64" rx="10" fill="#0f172a"/>
    <rect x="1065" y="397" width="200" height="64" rx="10" fill="#1e293b" fill-opacity="0.72" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="1165" y="425" class="name" text-anchor="middle">Result View / Report</text>
    <text x="1165" y="445" class="desc" text-anchor="middle">derived output · NOT CACHE</text>
  </g>

  <!-- Arrow labels -->
  <rect x="785" y="278" width="28" height="20" rx="5" fill="#0f172a"/>
  <text x="799" y="292" class="label" text-anchor="middle">run</text>
  <rect x="785" y="404" width="125" height="20" rx="5" fill="#0f172a"/>
  <text x="847" y="418" class="label" text-anchor="middle">target method/model</text>
  <rect x="1040" y="159" width="112" height="20" rx="5" fill="#0f172a"/>
  <text x="1096" y="173" class="label" text-anchor="middle">graph-aware metrics</text>

  <rect x="316" y="530" width="988" height="94" rx="14" fill="#111c2e" stroke="#334155"/>
  <text x="342" y="558" fill="#f8fafc" font-size="11" font-weight="700">DEPENDENCY RULE</text>
  <text x="342" y="579" class="note">上游 Artifact 被确认有 bug → 只级联真实 descendants；创建新版本不会让旧 Artifact 自动失效。</text>
  <text x="342" y="600" class="note">删除 Evaluation → Prediction / Selection / Score 完全保留。Result 只是 view，不承担阶段传递。</text>
</svg>
