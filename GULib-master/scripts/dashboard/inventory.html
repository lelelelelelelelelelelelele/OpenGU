<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experiment Config Inventory · Coverage Heatmap</title>
<style>
:root{color-scheme:dark;--bg:#101719;--panel:#182225;--line:#344447;--text:#e6eee9;--muted:#a8b9b4;--green:#8ed4aa;--amber:#e5bd72;--blue:#8abfce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}button{cursor:pointer}a,button,summary,input,select{outline-offset:5px}a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green)}.shell{max-width:1580px;margin:auto;padding:30px 44px 60px}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}.wordmark{font:600 16px Georgia,serif;letter-spacing:.1em}.toplinks{display:flex;gap:20px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1fr 300px;gap:50px;padding:36px 0 26px}h1{font:400 clamp(26px,3vw,42px)/1.2 Georgia,"Microsoft YaHei",serif;max-width:900px;margin:0 0 14px}.subtitle{color:var(--muted);max-width:850px;margin:0}.review{border-left:2px solid var(--green);padding-left:20px;align-self:center;color:var(--muted);font-size:13px}.review strong{display:block;color:var(--text);font-size:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:28px}.stat{padding:17px 22px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{font:36px Georgia,serif;margin-right:12px}.stat span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tabs{display:flex;gap:5px;flex-wrap:wrap}button,input,select{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 13px}button[aria-pressed=true]{background:var(--green);color:#12251a;border-color:var(--green);font-weight:600}input{margin-left:auto;width:230px}select{max-width:100%}.filter-note{color:var(--muted);font-size:13px;margin:6px 0 20px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}.side{position:sticky;top:20px;align-self:start;border-top:1px solid var(--line);padding-top:12px}.side a{display:block;padding:7px 0;color:var(--muted);font-size:13px}.side .small{font-size:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.group{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:24px;scroll-margin-top:20px;overflow:hidden}.group-header{padding:22px 26px 18px;display:flex;gap:18px;justify-content:space-between}.index{color:var(--green);font:14px Georgia,serif;letter-spacing:.08em}.group h2{font-size:23px;font-weight:500;margin:3px 0 5px}.question{margin:0;color:var(--text)}.note{color:var(--muted);font-size:13px;margin:8px 0 0;max-width:950px}.source-links{display:flex;gap:10px 20px;flex-wrap:wrap;padding:0 26px 18px;font-size:13px}.lane-title{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line);padding:12px 26px 0}.config{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(180px,1fr) minmax(180px,1fr);gap:22px;padding:17px 26px 20px}.config+.config{border-top:1px solid var(--line)}.config h3{font-size:16px;margin:0 0 8px}.config a{display:block;font-size:13px;margin:5px 0}.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;background:#223339;border:1px solid #466066;padding:2px 9px;border-radius:3px;font-size:12px;white-space:nowrap}.badge.completed,.badge.complete{color:var(--green);background:#21392c;border-color:#426a52}.badge.pending,.badge.partial,.badge.review{color:var(--amber);background:#3b3425;border-color:#756344}.bar{height:5px;background:#38474a;margin:13px 0 6px;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.numbers{font:25px Georgia,serif}.numbers small{font:12px "Segoe UI",sans-serif;color:var(--muted)}.analysis{padding:17px 26px 21px;background:#152023;border-top:1px solid var(--line)}.analysis-row{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:8px}.analysis-title{font-size:15px}.analysis-links{display:flex;flex-wrap:wrap;gap:18px;font-size:13px}.empty-part{padding:14px 26px 22px;color:var(--muted);font-size:13px}.history{border-top:1px solid var(--line)}summary{cursor:pointer;list-style-position:inside;padding:14px 26px;color:var(--amber);font-size:13px}.history-body{padding:0 26px 22px}.legend{font-size:12px;color:var(--muted);margin-bottom:12px}.heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.tile{display:block;background:#243034;border:1px solid #47585c;padding:10px;text-align:left;min-height:105px;overflow-wrap:anywhere;width:100%;transition:border-color .15s,background .15s}.tile:hover{border-color:var(--blue);background:#2b3b3e}.tile.produced{border-top:3px solid var(--green)}.tile.missing{border-top:3px solid #8a9691}.tile.partial{border-top:3px solid var(--amber)}.tile strong{font-size:13px;font-weight:500;display:block}.tile .count{font:20px Georgia,serif;margin-top:8px;display:block}.tile small{font-size:11px;color:var(--muted)}.history-detail{border:1px solid var(--line);padding:18px;margin-top:14px;overflow-wrap:anywhere}.history-detail h3{margin:0;font-size:16px}.evidence-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.evidence-grid div{font-size:12px;color:var(--muted)}.evidence-grid strong{display:block;color:var(--text);font-size:20px}.none{border:1px dashed var(--line);padding:45px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:22px;margin-top:30px;color:var(--muted);font-size:12px}details.run-detail{font-size:12px;overflow-wrap:anywhere}details.run-detail summary{padding:7px 0;color:var(--muted)}.run-detail code{font-size:11px;color:var(--muted)}.mobile-label{font-size:12px;color:var(--muted);margin-bottom:6px}#view-count{font-size:12px;color:var(--muted);margin-left:8px}@media(max-width:1050px){.shell{padding:22px}.layout{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.review{display:none}.config{grid-template-columns:1fr 1fr}.config>div:last-child{grid-column:1/-1}.toplinks{gap:12px}.stats .stat{padding:14px}.stat strong{font-size:28px}}@media(max-width:600px){.shell{padding:16px}.hero{padding:26px 0 20px}.topline{align-items:flex-start}.toplinks{font-size:12px;justify-content:flex-end}.wordmark{font-size:12px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.toolbar{gap:10px}input{width:100%;margin:0}.config{grid-template-columns:1fr;gap:16px}.group-header,.config,.analysis{padding:18px}.source-links,.lane-title{padding-left:18px;padding-right:18px}.group h2{font-size:21px}.history-body{padding:0 18px 18px}summary{padding:14px 18px}.evidence-grid{grid-template-columns:1fr 1fr}.heatmap{grid-template-columns:1fr 1fr}.tabs button{padding:7px 10px;font-size:13px}}
</style></head>
<body><div class="shell"><header class="topline"><div class="wordmark">OPENGU / RESEARCH</div><nav class="toplinks" id="nav" aria-label="项目入口"></nav></header>
<section class="hero"><div><h1>Experiment Config Inventory<br>· Coverage Heatmap</h1><p class="subtitle">按研究问题查看实验配置、运行覆盖、结果与分析。任务状态和依赖在 WorkBlock / Companion 中查看。</p></div><div class="review">实验来源核对<strong id="review-date"></strong>指定运行与历史覆盖分别展示<br>页面筛选不会提交或重跑实验</div></section>
<section class="stats" id="stats" aria-label="清单摘要"></section>
<div class="toolbar"><div class="tabs" aria-label="实验视图"><button data-view="all" aria-pressed="true">全部研究</button><button data-view="run" aria-pressed="false">待运行</button><button data-view="analysis" aria-pressed="false">待分析</button><button data-view="unknown" aria-pressed="false">待核对</button></div><label><span class="muted">覆盖范围 </span><select id="scope"><option value="all">全部来源</option><option value="current">本轮配置</option><option value="legacy">历史覆盖</option></select></label><input id="search" type="search" aria-label="搜索研究与配置" placeholder="搜索研究、配置、数据集…"></div>
<p class="filter-note">待运行仅包含已明确登记的待跑或未完成运行；待分析仅包含已有结果且分析未完成的配置。未核对来源单列。<span id="view-count" role="status" aria-live="polite"></span></p>
<div class="layout"><aside class="side" id="side" aria-label="研究部分导航"></aside><main id="groups"></main></div><footer id="footer"></footer></div>
<script>
'use strict';
const DATA = __DATA__;
const labels={unknown:'待核对',pending:'待运行',running:'运行中',partial:'部分完成',failed:'运行失败',completed:'运行完成',working:'分析中',review:'待复核',complete:'分析完成'};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const a=l=>`<a href="${e(l.href)}">${e(l.label)} ↗</a>`;
const badge=(s,analysis=false)=>`<span class="badge ${e(s)}">${analysis&&s==='pending'?'待分析':e(labels[s])}</span>`;
const configs=DATA.groups.flatMap(g=>g.configs);
const allAnalyses=DATA.groups.flatMap(g=>g.analyses);
const viewState={view:'all',scope:'all',search:''};
function needsAnalysis(c){const analyses=allAnalyses.filter(x=>x.inputs.includes(c.id));return c.completed>0&&(!analyses.length||analyses.some(x=>x.state!=='complete'));}
function matchesConfig(c){if(viewState.view==='run')return ['pending','running','partial','failed'].includes(c.run_state);if(viewState.view==='analysis')return needsAnalysis(c);if(viewState.view==='unknown')return c.run_state==='unknown';return true;}
function configHTML(c){const count=c.expected===null?'<span class="muted">覆盖范围尚未核定</span>':`<div class="numbers">${c.completed??'—'} <small>/ ${c.expected} 个逻辑条件</small></div><div class="bar"><span style="width:${100*(c.completed??0)/c.expected}%"></span></div>`;return `<article class="config" data-config="${e(c.id)}"><div><div class="mobile-label">实验配置</div><h3>${e(c.title)}</h3>${a(c.plan)}${c.configs.map(a).join('')}</div><div><div class="mobile-label">运行覆盖</div>${badge(c.run_state)}${count}<p class="note">${e(c.note)}</p></div><div><div class="mobile-label">结果与证据</div>${(c.result_links||[]).map(a).join('')}${c.runs.length?c.runs.map(r=>`${a(r)}<details class="run-detail"><summary>查看运行身份</summary><div>${e(r.experiment_id)}<br>${e(r.run_id)}<br><code>${e(r.commit)}</code><br>已核对 ${r.verified_files} 个结果文件</div></details>`).join(''):'<span class="muted">尚未关联经核对的运行结果</span>'}</div></article>`;}
function analysisHTML(group){if(!group.analyses.length)return '<div class="analysis"><div class="analysis-row"><span class="analysis-title">结果分析</span><span class="muted">尚未关联分析记录</span></div><span class="muted">可在研究部分关联一份综合多张配置的分析。</span></div>';return group.analyses.map(x=>`<section class="analysis"><div class="analysis-row"><span class="analysis-title">${e(x.title)}</span>${badge(x.state,true)}</div><div class="muted">输入：${x.inputs.map(id=>e(configs.find(c=>c.id===id).title)).join(' · ')}</div><div class="analysis-links">${x.links.map(a).join('')}</div></section>`).join('');}
function historicalHTML(group,rows){if(!rows.length)return '';return `<details class="history" ${viewState.scope==='legacy'?'open':''}><summary>历史覆盖热图 · ${rows.length} 张配置 · 不计入本轮完成数</summary><div class="history-body"><p class="legend">颜色表示历史产出覆盖：灰色未产出，琥珀色部分产出，绿色全部产出。产出不等于可用；点击配置查看可用、待重跑与远端接受数。不同配置可能重叠，不跨配置汇总完成率。</p><div class="heatmap">${rows.map(r=>`<button class="tile ${+r.done===0?'missing':+r.done===+r.n_cells?'produced':'partial'}" data-history="${e(r.name)}" aria-expanded="false" aria-controls="detail-${e(group.id)}"><strong>${e(r.name)}</strong><small>${e(r.dataset)} · ${e(r.model)} · ${e(r.ratio)}</small><span class="count">${r.done} <small>/ ${r.n_cells}</small></span></button>`).join('')}</div><div id="detail-${e(group.id)}" hidden class="history-detail" role="region" aria-label="历史配置详情"></div></div></details>`;}
function render(){let visible=[];for(const [idx,g] of DATA.groups.entries()){let cs=viewState.scope==='legacy'?[]:g.configs.filter(matchesConfig);let rows=viewState.scope==='current'||viewState.view!=='all'?[]:DATA.legacy.filter(r=>g.legacy_categories.includes(r.cat));const groupHit=[g.title,g.question,g.note].join(' ').toLowerCase().includes(viewState.search);if(viewState.search&&!groupHit){cs=cs.filter(c=>JSON.stringify(c).toLowerCase().includes(viewState.search));rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(viewState.search));}const showOverview=viewState.view==='all'&&viewState.scope==='all'&&(!viewState.search||groupHit);if(!showOverview&&!cs.length&&!rows.length)continue;visible.push({g,idx,cs,rows});}
document.getElementById('groups').innerHTML=visible.length?visible.map(({g,idx,cs,rows})=>`<section class="group" id="${e(g.id)}"><div class="group-header"><div><span class="index">${String(idx+1).padStart(2,'0')} / RESEARCH</span><h2>${e(g.title)}</h2><p class="question">${e(g.question)}</p><p class="note">${e(g.note)}</p></div></div><div class="source-links">${g.links.map(a).join('')}</div>${cs.length?'<div class="lane-title"><span>本轮实验配置单</span><span>运行与分析分别核对</span></div>'+cs.map(configHTML).join(''):viewState.scope==='legacy'?'':'<div class="empty-part">本部分尚未关联经核对的本轮运行范围，请从方案入口查看定义。</div>'}${viewState.scope==='legacy'?'':analysisHTML(g)}${historicalHTML(g,rows)}</section>`).join(''):'<div class="none">当前筛选没有匹配条目。<br>尚未核对运行来源的配置请查看“待核对”；历史覆盖请切换“全部研究”。</div>';
document.getElementById('view-count').textContent=`显示 ${visible.length} / ${DATA.groups.length} 个研究部分`;
document.getElementById('side').innerHTML=visible.map(({g,idx})=>`<a href="#${e(g.id)}">${String(idx+1).padStart(2,'0')}　${e(g.title)}</a>`).join('')+'<div class="small">任务登记、状态和依赖由 Companion / WorkBlock 管理。实验清单只关联研究定义与证据。</div>';
for(const button of document.querySelectorAll('[data-history]'))button.addEventListener('click',()=>{const r=DATA.legacy.find(x=>x.name===button.dataset.history);const panel=document.getElementById(button.getAttribute('aria-controls'));const closing=button.getAttribute('aria-expanded')==='true';for(const b of button.closest('.heatmap').querySelectorAll('button'))b.setAttribute('aria-expanded','false');panel.hidden=closing;if(closing)return;button.setAttribute('aria-expanded','true');panel.innerHTML=`<h3>${e(r.name)}</h3><div class="muted">历史配置 · ${e(r.cat)} · 数据来源 ${e(r.src)}</div><div class="evidence-grid">${[['产出',r.done],['历史登记可用',r.valid||'未登记'],['待重跑',r.rerun||'未登记'],['远端接受 / 待归档',r.accepted_remote||'未登记']].map(([label,value])=>`<div>${e(label)}<strong>${e(value)}</strong></div>`).join('')}</div><div class="muted">${e(r.warning||'尚无附加核验说明；历史产出数不能自动作为当前可用数。')}</div><p>${r.definition?a(r.definition):'原配置未定位；保留历史条目，不生成猜测链接。'}</p><div class="muted">方法：${e(r.methods)}<br>策略：${e(r.strategies)}<br>Seeds：${e(r.seeds)}</div>`;});}
document.getElementById('nav').innerHTML=DATA.navigation.slice(0,3).map(a).join('');
document.getElementById('review-date').textContent=DATA.reviewed_at;
const completed=configs.filter(c=>c.run_state==='completed').length, unknown=configs.filter(c=>c.run_state==='unknown').length;
document.getElementById('stats').innerHTML=[[DATA.groups.length,'研究部分'],[configs.length,'本轮配置单'],[completed,'已核对运行完成'],[unknown,'运行状态待核对']].map(([n,l])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('');
document.getElementById('footer').innerHTML=DATA.navigation.slice(3).map(a).join('　 ·　 ')+'<p>来源核对日期：'+e(DATA.reviewed_at)+'。本页为清单快照，未连接实时作业监控；历史 CSV 原始计数保留。任务编辑不会刷新或改写本页。</p>';
for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{viewState.view=b.dataset.view;for(const x of document.querySelectorAll('[data-view]'))x.setAttribute('aria-pressed',String(x===b));render();});
document.getElementById('scope').addEventListener('change',evt=>{viewState.scope=evt.target.value;render();});document.getElementById('search').addEventListener('input',evt=>{viewState.search=evt.target.value.trim().toLowerCase();render();});render();
</script></body></html>
