<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文分块审阅</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><small>WWW 2027 / MANUSCRIPT</small><h1>论文分块审阅</h1></div><button id="refresh">刷新 LaTeX 展示</button></header>
<div class="layout"><aside><p class="label">审阅内容</p><nav id="blocks"></nav><section class="cloud"><p class="label">Overleaf</p><h3 id="sync-status">未验证</h3><p id="sync-detail"></p><a id="overleaf" target="_blank" rel="noreferrer">打开既有项目 ↗</a><label class="file">检查最新云端源码 ZIP<input id="cloud-zip" type="file" accept=".zip"></label><button id="pull" hidden>取回云端修改并合并</button><a class="button" id="package" href="/api/package" download="paper-changes.zip" hidden>下载待上传差异包</a><details><summary>云端差异</summary><pre id="cloud-diff"></pre></details></section><p class="note">展示由 LaTeX 编译生成。审阅意见与修改记录单独保存；本页不改变实验的科学接受状态。</p></aside>
<main><div class="block-heading"><div><p class="label" id="number"></p><h2 id="title"></h2></div><a id="source-link" href="#source-panel">定位源码 ↓</a></div><p id="path" class="path"></p><div class="view-switch" aria-label="阅读方式"><button id="html-view" aria-pressed="true">HTML 正文</button><button id="source-view" aria-pressed="false">LaTeX 源码</button></div><div id="message" role="status" aria-live="polite"></div><iframe id="preview" title="论文 HTML 正文" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
<section id="source-panel" hidden><h3>LaTeX 源码与修改</h3><p>只编辑当前块。保存前填写原因；若源码已被外部修改，本次保存会被拒绝。</p><textarea id="source" aria-label="LaTeX 源码" spellcheck="false"></textarea><label>修改原因<input id="reason" placeholder="说明修改依据或对应的审阅意见"></label><button id="save">保存 LaTeX 并刷新</button></section>
<details><summary>相对 Git HEAD 的论文差异</summary><pre id="git-diff"></pre></details></main>
<section class="review"><p class="label">审阅记录</p><h2>意见与修改</h2><label>本块意见<textarea id="comment" placeholder="填写问题、依据或建议"></textarea></label><button id="add-comment">保存意见</button><div id="events"></div></section></div><script src="/app.js"></script></body></html>
