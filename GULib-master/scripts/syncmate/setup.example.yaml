version: 0

# Use `python scripts/syncmate/syncmate.py init-device ...` to create
# .syncmate/device.yaml, then use this file as a reference for adding peers.
# Keep .syncmate/ untracked. This is the only device-specific area.

device_id: local-laptop
role: collector
repo_path: E:/project/OpenGU/GULib-master

# Collector nodes list peers here. Runner-only nodes may omit peers.
peers:
  gpu4090:
    role: runner
    transport: ssh
    ssh: autodl-4090
    repo_path: ~/autodl-fs/OpenGU/GULib-master
    # Non-interactive SSH may not expose the intended environment on PATH.
    python_executable: /root/miniconda3/bin/python

  h800:
    role: runner
    transport: ssh
    ssh: autodl-h800
    repo_path: ~/autodl-fs/OpenGU/GULib-master
    python_executable: /root/miniconda3/bin/python

  local-runner:
    # Same-machine rehearsal mode. Generated by:
    # python scripts/syncmate/syncmate.py setup-plan --peer-id local-runner --peer-local --peer-repo-path ../GULib-runner-copy --write
    # python scripts/syncmate/syncmate.py add-peer local-runner --local --repo-path ../GULib-runner-copy
    role: runner
    transport: local
    repo_path: ../GULib-runner-copy

artifact_policy:
  # This block can also be generated with --artifact-include/--artifact-exclude.
  # This policy filters explicit bulk inventory. Per-job returns use the recipe.
  # Add predictions.npz here only when
  # that larger artifact is intentionally part of the sync/checksum contract.
  include:
    - attack.json
    - collateral.json
    - _meta.json
  exclude:
    - predictions.npz
