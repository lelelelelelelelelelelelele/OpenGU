kind: selector
schema_version: 1
method: gt_full
candidate:
  pool: train_mask
budget:
  mode: ratio
  value: 0.01
# SGC scores deletion requests; the downstream model is configured separately.
model:
  architecture: OpenGU.SGCNet
  layers: 2
  dropout: 0.0
training:
  # Match the GCN selector instead of inheriting SGC's different learning rate.
  lr: 0.005
parameters:
  parameter_scope: all_trainable
  affected_hops: 3
