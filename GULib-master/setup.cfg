[metadata]
name = opengu-syncmate
version = 0.2.1
description = Installed OpenGU consumer for SyncMate committed execution

[options]
packages = opengu_syncmate
python_requires = >=3.8
install_requires =
    syncmate==0.7.1
    PyYAML>=6

[options.entry_points]
console_scripts =
    opengu-syncmate = opengu_syncmate.control:main
