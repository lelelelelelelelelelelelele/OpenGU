function configHTML(c){const count=c.expected===null?'<span class="muted">覆盖范围尚未核定</span>':`<div class="numbers">${c.completed??'—'} <small>/ ${c.expected} 个逻辑条件</small></div><div class="bar"><span style="width:${100*(c.completed??0)/c.expected}%"></span></div>`;return `<article class="config" data-config="${e(c.id)}"><div><div class="mobile-label">实验配置</div><h3>${e(c.title)}</h3>${a(c.plan)}${c.configs.map(a).join('')}</div><div><div class="mobile-label">运行覆盖</div>${badge(c.run_state)}${count}<p class="note">${e(c.note)}</p></div><div><div class="mobile-label">结果与证据</div>${(c.result_links||[]).map(a).join('')}${c.runs.length?c.runs.map(r=>`${a(r)}<details class="run-detail"><summary>查看运行身份</summary><div>${e(r.experiment_id)}<br>${e(r.run_id)}<br><code>${e(r.commit)}</code><br>已核对 ${r.verified_files} 个结果文件</div></details>`).join(''):'<span class="muted">尚未关联经核对的运行结果</span>'}</div></article>`;}

function historicalHTML(group,rows){if(!rows.length)return '';return `<details class="history" ${viewState.scope==='legacy'?'open':''}><summary>历史覆盖热图 · ${rows.length} 张配置 · 不计入本轮完成数</summary><div class="history-body"><p class="legend">颜色表示历史产出覆盖：灰色未产出，琥珀色部分产出，绿色全部产出。产出不等于可用；点击配置查看可用、待重跑与远端接受数。不同配置可能重叠，不跨配置汇总完成率。</p><div class="heatmap">${rows.map(r=>`<button class="tile ${+r.done===0?'missing':+r.done===+r.n_cells?'produced':'partial'}" data-history="${e(r.name)}" aria-expanded="false" aria-controls="detail-${e(group.id)}"><strong>${e(r.name)}</strong><small>${e(r.dataset)} · ${e(r.model)} · ${e(r.ratio)}</small><span class="count">${r.done} <small>/ ${r.n_cells}</small></span></button>`).join('')}</div><div id="detail-${e(group.id)}" hidden class="history-detail" role="region" aria-label="历史配置详情"></div></div></details>`;}
function render(){let visible=[];for(const [idx,g] of DATA.groups.entries()){let cs=viewState.scope==='legacy'?[]:g.configs.filter(matchesConfig);let rows=viewState.scope==='current'||viewState.view!=='all'?[]:DATA.legacy.filter(r=>g.legacy_categories.includes(r.cat));const groupHit=[g.title,g.question,g.note].join(' ').toLowerCase().includes(viewState.search);if(viewState.search&&!groupHit){cs=cs.filter(c=>JSON.stringify(c).toLowerCase().includes(viewState.search));rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(viewState.search));}const showOverview=viewState.view==='all'&&viewState.scope==='all'&&(!viewState.search||groupHit);if(!showOverview&&!cs.length&&!rows.length)continue;visible.push({g,idx,cs,rows});}
document.getElementById('groups').innerHTML=visible.length?visible.map(({g,idx,cs,rows})=>`<section class="group" id="${e(g.id)}"><div class="group-header"><div><span class="index">${String(idx+1).padStart(2,'0')} / RESEARCH</span><h2>${e(g.title)}</h2><p class="question">${e(g.question)}</p><p class="note">${e(g.note)}</p></div></div><div class="source-links">${g.links.map(a).join('')}</div>${cs.length?'<div class="lane-title"><span>本轮实验配置单</span><span>运行与分析分别核对</span></div>'+cs.map(configHTML).join(''):viewState.scope==='legacy'?'':'<div class="empty-part">本部分尚未关联经核对的本轮运行范围，请从方案入口查看定义。</div>'}${viewState.scope==='legacy'?'':analysisHTML(g)}${historicalHTML(g,rows)}</section>`).join(''):'<div class="none">当前筛选没有匹配条目。<br>尚未核对运行来源的配置请查看“待核对”；历史覆盖请切换“全部研究”。</div>';
document.getElementById('view-count').textContent=`显示 ${visible.length} / ${DATA.groups.length} 个研究部分`;
document.getElementById('side').innerHTML=visible.map(({g,idx})=>`<a href="#${e(g.id)}">${String(idx+1).padStart(2,'0')}　${e(g.title)}</a>`).join('')+'<div class="small">任务登记、状态和依赖由 Companion / WorkBlock 管理。实验清单只关联研究定义与证据。</div>';
for(const button of document.querySelectorAll('[data-history]'))button.addEventListener('click',()=>{const r=DATA.legacy.find(x=>x.name===button.dataset.history);const panel=document.getElementById(button.getAttribute('aria-controls'));const closing=button.getAttribute('aria-expanded')==='true';for(const b of button.closest('.heatmap').querySelectorAll('button'))b.setAttribute('aria-expanded','false');panel.hidden=closing;if(closing)return;button.setAttribute('aria-expanded','true');panel.innerHTML=`<h3>${e(r.name)}</h3><div class="muted">历史配置 · ${e(r.cat)} · 数据来源 ${e(r.src)}</div><div class="evidence-grid">${[['产出',r.done],['历史登记可用',r.valid||'未登记'],['待重跑',r.rerun||'未登记'],['远端接受 / 待归档',r.accepted_remote||'未登记']].map(([label,value])=>`<div>${e(label)}<strong>${e(value)}</strong></div>`).join('')}</div><div class="muted">${e(r.warning||'尚无附加核验说明；历史产出数不能自动作为当前可用数。')}</div><p>${r.definition?a(r.definition):'原配置未定位；保留历史条目，不生成猜测链接。'}</p><div class="muted">方法：${e(r.methods)}<br>策略：${e(r.strategies)}<br>Seeds：${e(r.seeds)}</div>`;});}
document.getElementById('nav').innerHTML=DATA.navigation.slice(0,3).map(a).join('');
document.getElementById('review-date').textContent=DATA.reviewed_at;
const completed=configs.filter(c=>c.run_state==='completed').length, unknown=configs.filter(c=>c.run_state==='unknown').length;
document.getElementById('stats').innerHTML=[[DATA.groups.length,'研究部分'],[configs.length,'本轮配置单'],[completed,'已核对运行完成'],[unknown,'运行状态待核对']].map(([n,l])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('');
document.getElementById('footer').innerHTML=DATA.navigation.slice(3).map(a).join('　 ·　 ')+'<p>来源核对日期：'+e(DATA.reviewed_at)+'。本页为清单快照，未连接实时作业监控；历史 CSV 原始计数保留。任务编辑不会刷新或改写本页。</p>';
for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{viewState.view=b.dataset.view;for(const x of document.querySelectorAll('[data-view]'))x.setAttribute('aria-pressed',String(x===b));render();});
document.getElementById('scope').addEventListener('change',evt=>{viewState.scope=evt.target.value;render();});document.getElementById('search').addEventListener('input',evt=>{viewState.search=evt.target.value.trim().toLowerCase();render();});render();
</script></body></html>
